name: zju_campus_agent
description: 求是书院 · 本地优先校园助手
publish_to: none
version: 0.2.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  drift: ^2.30.0
  sqlite3: ^3.1.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.2
  crypto: ^3.0.6
  archive: ^3.6.1
  flutter_svg: ^2.2.0
  flutter_markdown: ^0.7.7
  html: ^0.15.6
  file_picker: ^10.3.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  excel: ^4.0.6
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/knowledge.json
    - assets/calendars.json
    - assets/prompts.json
    - assets/tray.ico
    - assets/fonts/NotoSerifSC-LICENSE.txt
    - assets/fonts/MaShanZheng-LICENSE.txt
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng.ttf
